# Clippy thresholds of docs/development/code-rules.md ("Lint ratchet"). The parameter limit is denied
# by the clippy gate of tools/check.sh; tools/check-lint.mjs counts the cognitive-complexity warning
# per file, so that gate allows it and the count reaches the script.

# At most five parameters: more means a missing type that groups them.
too-many-arguments-threshold = 5

# A function is too much when it does several separately named jobs in sequence.
cognitive-complexity-threshold = 25
