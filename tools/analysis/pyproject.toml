[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "packing"
version = "0.1.0"
description = "Analysis tools for the packing PDFs and CSVs (not product code; frozen, the PC app is the truth)"
requires-python = ">=3.12"
dependencies = ["pypdf>=6.19", "fpdf2>=2.8.9"]

[project.optional-dependencies]
dev = ["pytest>=9.1"]

[tool.setuptools]
packages = ["packing"]

[tool.setuptools.package-data]
packing = ["*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
