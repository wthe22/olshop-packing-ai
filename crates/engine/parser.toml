# How labels are read: the couriers, the clues that name them, and the header images that are not
# couriers. Written into the data folder when missing; from then on it is the owner's.
#
# A hash is XXH3-64 (seed 0) of an image, 16 lower-case hex characters:
#   logos   of the image's encoded bytes (one stable value per courier asset)
#   shapes  of its 64 x 64 appearance, for a masked logo whose bytes name nothing
# tracking_id is the tracking-ID form, matched fully against a token of the label.
# A courier is named only when its logo (or shape) and its tracking-ID form agree.

schema = "1.0"

[[couriers]]
code = "jnt"
name = "J&T Express"

[[couriers]]
code = "sicepat"
name = "SiCepat"

[[couriers]]
code = "jnt-cargo"
name = "J&T Cargo"

[[couriers]]
code = "idx"
name = "IDX"

[[couriers]]
code = "spx"
name = "SPX"

[[couriers]]
code = "gojek"
name = "Gojek"

[[couriers]]
code = "grab"
name = "Grab"

[[couriers]]
code = "anteraja"
name = "Anteraja"

[[courier_classifier]]
courier_code = "jnt"
logos = ["39b9b7b9f61d0e7f"]     # 975x377 px, the same asset in every sample file
tracking_id = 'J[XY]\d{10}'
text = ["jet.co.id"]

[[courier_classifier]]
courier_code = "sicepat"
logos = ["cf33ed60daa291b1"]     # 184x60 px
tracking_id = '00\d{10}'

[[courier_classifier]]
courier_code = "jnt-cargo"
shapes = ["753ccbd14749befa"]    # masked wordmark: its bytes name nothing
tracking_id = '57\d{10}'
text = ["FastTrack"]

[[courier_classifier]]
courier_code = "idx"
logos = ["9131c1f94ad363d4"]     # 1200x859 px
tracking_id = 'TKP\d{10}'

[[courier_classifier]]
courier_code = "spx"
logos = ["4583097ef370a670", "7f0d33c143e2ab14"]     # 68x27 px, masked: the small red SPX wordmark
tracking_id = 'SPXID\d{11}[A-Z]'   # the letter after the digits is part of the ID

[[courier_classifier]]
courier_code = "anteraja"
logos = ["556e376839c5805d"]     # 354x142 px
tracking_id = 'TSA-\d{11}'

# An instant-service label prints no logo and no tracking ID: its service tag names the courier.
[[courier_classifier]]
courier_code = "gojek"
instant_tags = ["GKS"]

[[courier_classifier]]
courier_code = "grab"
instant_tags = ["Sameday", "Same-day"]

# The buying channels' strips: tokopedia | Shop 905x118, tokopedia | TikTok 527x73, the Shopee
# wordmark 800x253, TikTok Shop 326x59, tokopedia PLUS 618x78.
[not_courier]
logos = ["6c1340227db55be4", "c2230c3c5d8c560d", "07fea99cbec66ae7", "f2cf7019646c955b", "330b79a3b29d4646"]
