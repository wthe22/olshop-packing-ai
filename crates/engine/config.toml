# The accounts and the sort rules. Written into the data folder when missing; from then on it is
# the owner's. The Accounts and Sort rules screens edit it; a sort rule's courier filters name the
# couriers of parser.toml.

schema = "1.0"

# Sort rules: a batch is sorted by the rule chosen for it. Its label groups apply in order; an
# order goes to the FIRST group whose filter matches. A group without a filter takes every order
# left and must be last. A rule with `enabled = false` is kept but not offered on New batch.

[[label_sort_rules]]
name = "default"

[[label_sort_rules.label_groups]]
code = "Z"
name = "Lainnya"
