[workspace]
resolver = "3"
members = ["crates/*", "app/src-tauri"]

[workspace.package]
edition = "2024"
version = "0.2.0"
publish = false

[workspace.dependencies]
image = "0.25"
jiff = { version = "0.2", features = ["serde"] }
lopdf = { version = "0.46", default-features = false }
pdfium-render = "=0.9.4"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "1"
toml_edit = "0.25"
trash = { version = "5.2", default-features = false, features = ["coinit_apartmentthreaded"] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }
packing-batch = { path = "crates/batch" }
packing-engine = { path = "crates/engine" }
packing-pdf = { path = "crates/pdf" }
packing-store = { path = "crates/store" }
packing-verify = { path = "crates/verify" }

# Profiles must live at the workspace root (a member's [profile] is ignored).
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
